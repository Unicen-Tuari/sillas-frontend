<table class="table">
  <thead>
    <tr>
      <th scope="col">#</th>
      <th scope="col">Nombre</th>
      <th scope="col">Marca</th>
      <th scope="col">Precio</th>
      <th scope="col">Uso</th>
      <th scope="col">Acciones</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngIf="sillas().length === 0">
      <td colspan="6" class="text-center">No hay sillas disponibles</td>
    </tr>
    <tr *ngFor="let silla of sillas();">
      <th scope="row">{{ silla.id }}</th>
      <td>{{ silla.nombre }}</td>
      <td>{{ silla.marca }}</td>
      <td>${{ silla.precio }}</td>
      <td>{{ silla.uso.nombre }}</td>
      <td>
        <button class="btn btn-primary btn-sm">Editar</button>
        <button class="btn btn-danger btn-sm" (click)="eliminarSilla(silla)">Eliminar</button>
    </tr>
  </tbody>
</table>

<button class="btn btn-success" (click)="getSillas()">Actualizar</button>
<h1>{{ titulo }}</h1>
<input class="form-control" [(ngModel)]="titulo" />
