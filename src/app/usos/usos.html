<h1>Usos</h1>
<div>
<table>
<thead>
    <tr>
      <th scope="col">#</th>
      <th scope="col">Nombre</th>
      <th scope="col">Acciones</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngIf="usos().length === 0">
      <td colspan="3" class="text-center">No hay usos disponibles</td>
    </tr>
    <tr *ngFor="let uso of usos();">
      <th scope="row">{{ uso.id }}</th>
      <td>{{ uso.nombre }}</td>
      <td>
        <button class="btn btn-primary btn-sm">Editar</button>
        <button class="btn btn-danger btn-sm">Eliminar</button>
    </tr>
  </tbody>
</table>
</div>
